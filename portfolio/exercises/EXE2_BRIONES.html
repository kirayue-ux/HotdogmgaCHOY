<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Personal Details - Jacob C. Briones</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #111827, #1f2937);
        color: #f9fafb;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 30px 15px;
    }
    .card {
        width: 100%;
        max-width: 720px;
        background: #ffffff;
        color: #1f2937;
        border-radius: 22px;
        overflow: hidden;
        box-shadow: 0 18px 45px rgba(0,0,0,.35);
    }
    .header {
        background: linear-gradient(135deg, #2563eb, #4f46e5);
        padding: 35px 30px;
        text-align: center;
    }
    .avatar {
        width: 82px;
        height: 82px;
        margin: 0 auto 15px;
        border-radius: 50%;
        background: #fff;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
        font-weight: 800;
        border: 4px solid rgba(255,255,255,.65);
    }
    h1 {
        margin: 0;
        font-size: 30px;
        color: #fff;
    }
    .subtitle {
        margin: 8px 0 0;
        color: #dbeafe;
        font-size: 14px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .content { padding: 28px; }
    .info {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
    }
    .item {
        padding: 17px;
        background: #f8fafc;
        border-left: 4px solid #4f46e5;
        border-radius: 10px;
    }
    .label {
        display: block;
        font-size: 12px;
        color: #64748b;
        font-weight: bold;
        text-transform: uppercase;
        margin-bottom: 5px;
        letter-spacing: .5px;
    }
    .value {
        font-size: 16px;
        font-weight: 600;
        word-break: break-word;
    }
    .motto {
        margin-top: 22px;
        padding: 22px;
        text-align: center;
        border-radius: 14px;
        background: #eef2ff;
        border: 1px solid #c7d2fe;
    }
    .motto-title {
        color: #4f46e5;
        font-size: 12px;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1.5px;
    }
    .motto p {
        margin: 10px 0 0;
        font-size: 24px;
        font-weight: 800;
        color: #1e1b4b;
    }
    .footer {
        text-align: center;
        padding: 15px;
        font-size: 12px;
        color: #64748b;
        background: #f8fafc;
    }
    @media (max-width: 600px) {
        .info { grid-template-columns: 1fr; }
        h1 { font-size: 25px; }
        .content { padding: 20px; }
    }
</style>
</head>
<body>
<div class="card">
    <div class="header">
        <div class="avatar">JB</div>
        <h1>Jacob C. Briones</h1>
        <div class="subtitle">Personal Information</div>
    </div>

    <div class="content">
        <div class="info">
            <div class="item"><span class="label">Name</span><span class="value">Jacob C Briones</span></div>
            <div class="item"><span class="label">Age</span><span class="value">19</span></div>
            <div class="item"><span class="label">Address</span><span class="value">Paknaan, Mandaue City</span></div>
            <div class="item"><span class="label">Contact No.</span><span class="value">09636453968</span></div>
            <div class="item"><span class="label">Email Address</span><span class="value">jacobbriones2007@gmail.com</span></div>
            <div class="item"><span class="label">Gender</span><span class="value">Male</span></div>
            <div class="item"><span class="label">Birthdate</span><span class="value">July 26, 2007</span></div>
        </div>

        <div class="motto">
            <div class="motto-title">My Motto</div>
            <p>"MOTOTOY."</p>
        </div>
    </div>

    <div class="footer">Created by Jacob C. Briones</div>
</div>
</body>
</html>
