<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Favorite Poem | Jacob Briones</title>

<style>
    * { box-sizing: border-box; }

    body {
        margin: 0;
        min-height: 100vh;
        font-family: Georgia, "Times New Roman", serif;
        background: #f7efe3;
        color: #30261f;
    }

    .page {
        width: min(900px, 92%);
        margin: 45px auto;
    }

    .heading {
        text-align: center;
        margin-bottom: 35px;
    }

    .heading .small {
        color: #a35d35;
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 4px;
        text-transform: uppercase;
    }

    .heading h1 {
        margin: 12px 0 8px;
        font-size: clamp(42px, 8vw, 68px);
        font-weight: normal;
    }

    .heading .line {
        width: 75px;
        height: 4px;
        margin: 0 auto;
        background: #c9895b;
        border-radius: 10px;
    }

    .poem-card {
        position: relative;
        background: #fffdf9;
        padding: 55px 45px;
        border-radius: 4px;
        box-shadow: 0 18px 45px rgba(67, 45, 30, .13);
        overflow: hidden;
    }

    .poem-card::before {
        content: "“";
        position: absolute;
        top: -35px;
        left: 20px;
        font-size: 190px;
        color: #ead1bd;
        line-height: 1;
        z-index: 0;
    }

    .poem {
        position: relative;
        z-index: 1;
        max-width: 680px;
        margin: auto;
        border-top: 1px solid #e6d6c7;
        border-bottom: 1px solid #e6d6c7;
        padding: 28px 0;
    }

    .poem p {
        margin: 18px 0;
        font-size: clamp(20px, 4vw, 28px);
        line-height: 1.65;
        text-align: center;
    }

    .poem p:nth-child(1) { color: #75452d; }
    .poem p:nth-child(2) { color: #47645a; }
    .poem p:nth-child(3) { color: #8b5e34; }
    .poem p:nth-child(4) { color: #5a4a68; }

    .author {
        text-align: center;
        margin-top: 32px;
        font-family: Arial, sans-serif;
    }

    .author strong {
        display: block;
        font-size: 18px;
        color: #30261f;
    }

    .author span {
        display: inline-block;
        margin-top: 7px;
        color: #a35d35;
        font-size: 14px;
    }

    .note {
        margin-top: 22px;
        text-align: center;
        color: #806f61;
        font-family: Arial, sans-serif;
        font-size: 13px;
    }

    @media (max-width: 600px) {
        .page {
            margin: 25px auto;
        }

        .poem-card {
            padding: 45px 22px;
        }

        .poem p {
            margin: 15px 0;
        }
    }
</style>
</head>

<body>

<div class="page">

    <header class="heading">
        <div class="small">A Short Reflection</div>
        <h1>My Favorite Poem</h1>
        <div class="line"></div>
    </header>

    <section class="poem-card">

        <div class="poem">
            <p>The sun will rise after the darkest night,</p>
            <p>Giving us courage to continue the fight.</p>
            <p>Every small step can lead to something new,</p>
            <p>Believe in yourself and your dreams will come true.</p>
        </div>

        <div class="author">
            <strong>Jacob Briones</strong>
            <span>“Believe in Yourself”</span>
        </div>

        <div class="note">
            Keep moving forward, one step at a time.
        </div>

    </section>

</div>

</body>
</html>
